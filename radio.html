<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>港ラジオ受信機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root { --bg:#0b0d12; --panel:#1b1f2a; --fg:#e8e6d9; --led:#ffb300; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); font-family:"DotGothic16", monospace; }
  .radio { width:min(560px, calc(100vw - 32px)); background:var(--panel); border:4px solid #3b4252;
    padding:20px; box-shadow:8px 8px 0 #000; }
  h1 { margin:0 0 12px; font-size:20px; letter-spacing:2px; }
  .display { background:#050607; border:3px solid #333; padding:12px; font-size:32px; color:#7CFC9A;
    text-align:right; font-variant-numeric:tabular-nums; }
  canvas { width:100%; height:60px; image-rendering:pixelated; background:#050607; border:3px solid #333;
    margin-top:10px; display:block; }
  input[type=range] { width:100%; margin-top:16px; accent-color:var(--led); }
  .lamp-row { display:flex; align-items:center; gap:12px; margin-top:16px; }
  .lamp { width:48px; height:48px; border:4px solid #000; background:#2a1f00; }
  .lamp.on { background:var(--led); box-shadow:0 0 24px var(--led); }
  .note { color:#8a8f9e; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<div class="radio">
  <h1>港ラジオ 受信機 RX-77</h1>
  <div class="display"><span id="freq">88.0</span> MHz</div>
  <canvas id="scope" width="160" height="30"></canvas>
  <input id="dial" type="range" min="880" max="1080" step="1" value="880">
  <div class="lamp-row"><div id="lamp" class="lamp"></div><span id="status">ノイズ</span></div>
  <div class="note">← / → キーでも周波数を合わせられます</div>
</div>
<script src="js/radio.js"></script>
</body>
</html>
